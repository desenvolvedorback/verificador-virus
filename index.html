<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Malware</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Verificador de Arquivos</h1>
        <p>Envie um arquivo para verificar se ele contém códigos maliciosos.</p>
        
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="arquivo" required>
            <button type="submit">Analisar Arquivo</button>
        </form>

        <h2>Histórico de Verificações</h2>
        <div class="historico">
            {% for item in historico %}
            <div class="item-historico">
                <strong>Arquivo:</strong> {{ item.nome }} <br>
                <strong>SHA-256:</strong> {{ item.hash }} <br>
                <strong>Status:</strong> <span class="{{ item.status }}">{{ item.status }}</span>
            </div>
            <hr>
            {% endfor %}
        </div>
    </div>
</body>
</html>
